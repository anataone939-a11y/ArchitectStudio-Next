
name: Install and Build ArchitectStudio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract project
        run: |
          test -f ArchitectStudio-Next-source.zip
          unzip -q ArchitectStudio-Next-source.zip -d unpacked
          cp -a unpacked/ArchitectStudio-Next/. .
          rm -rf unpacked ArchitectStudio-Next-source.zip

      - name: Save source files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows/build.yml'
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Install ArchitectStudio project structure"
            git push
          fi

      - name: Build ArchitectStudio
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: ArchitectStudio-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
